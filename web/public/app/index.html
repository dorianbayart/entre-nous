<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f6f5f2" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#151515" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Entre Nous">
  <meta name="description" content="Le copier-coller, en mieux. Un presse-papier malin, partagé, multiplateforme, chiffré de bout en bout, éphémère, sans compte, sans trace. Copy-paste, only better. A smart clipboard: shared, cross-platform, end-to-end encrypted, ephemeral, no account, no trace.">
  <title>Entre Nous</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="app.css">
  <script type="module" src="app.js"></script>
</head>
<body>
<div class="app" x-data="app" x-cloak
     @dragenter="onDragEnter($event)" @dragover.prevent="onDragOver" @dragleave="onDragLeave"
     @drop.prevent="onDrop($event)">

  <!-- Loading; the app could not start (Keychain unavailable…): why, and Retry -->
  <div class="center" x-show="view === 'loading'">
    <div class="logo"></div>
    <p x-show="bootError" x-text="t('boot.failed')"></p>
    <p class="muted small" x-show="bootError" x-text="bootError"></p>
    <button class="primary" x-show="bootError" @click="retryBoot" x-text="t('boot.retry')"></button>
  </div>

  <!-- iOS: install first (a home screen web app does not share Safari's storage) -->
  <section class="center page" x-show="view === 'install'">
    <div class="logo"></div>
    <h1 x-text="t('install.title')"></h1>
    <ol class="steps">
      <li x-rich="t('install.step1')"></li>
      <li x-rich="t('install.step2')"></li>
      <li x-rich="t('install.step3')"></li>
    </ol>
    <p class="muted" x-text="t('install.why')"></p>
    <button class="secondary" @click="joinInBrowser" :disabled="busy" x-text="t('install.inBrowser')"></button>
    <p class="muted small" x-text="t('install.inBrowserHint')"></p>
  </section>

  <!-- No group: first launch on a phone, or the last group left -->
  <section class="center page" x-show="view === 'welcome'">
    <div class="logo"></div>
    <h1>Entre Nous</h1>
    <p class="muted" x-rich="t('welcome.lead')"></p>
    <div class="welcome">
      <button class="primary wide" x-show="mobile" @click="startScan" :disabled="busy" x-text="t('scan')"></button>
      <button class="primary wide" x-show="!mobile" @click="createGroup" x-text="t('createGroup')"></button>
      <p class="muted small" x-text="t('welcome.joinHelp')"></p>
      <div class="inline">
        <input type="url" :placeholder="t('inviteLink')" x-model="joinLink">
        <button class="secondary" @click="joinFromLink" :disabled="busy" x-text="t('join')"></button>
      </div>
      <button class="ghost" x-show="mobile" @click="createGroup" x-text="t('welcome.orCreate')"></button>
    </div>
    <button class="ghost" x-show="canInstall" @click="install" x-text="t('install')"></button>
  </section>

  <!-- Main -->
  <section class="main" :class="slide" x-show="view === 'main'">
    <header class="bar">
      <!-- search in the history: the bar becomes its field -->
      <div class="search-bar" x-show="search.open" x-cloak>
        <button class="icon" @click="closeSearch" :aria-label="t('search.close')" :title="t('search.close')">
          <svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>
        </button>
        <div class="search-field">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input type="search" x-ref="search" :value="search.q" @input="onSearchInput($event)" @keydown="onSearchKey($event)"
                 :placeholder="t('search')" :aria-label="t('search')" enterkeyhint="search" autocomplete="off" spellcheck="false">
          <button class="icon" x-show="search.q" @click="clearSearch" :aria-label="t('search.clear')" :title="t('search.clear')">
            <svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg>
          </button>
        </div>
      </div>
      <div class="title" x-show="!search.open">
        <span class="dot" :class="group && group.status === 'online' ? 'on' : 'off'"></span>
        <template x-if="groups.length > 1">
          <select class="group-select" :value="groupId" @change="selectGroup($event.target.value)">
            <template x-for="g in groups" :key="g.id">
              <option :value="g.id" x-text="g.name"></option>
            </template>
          </select>
        </template>
        <template x-if="groups.length <= 1">
          <strong x-text="group ? group.name : ''"></strong>
        </template>
      </div>
      <div class="bar-actions" x-show="!search.open">
      <button class="icon" x-show="desktop && prefs.autoShare" @click="togglePause" :class="prefs.paused ? 'paused' : ''"
              :aria-label="t(prefs.paused ? 'pause.resume' : 'pause.pause')"
              :title="t(prefs.paused ? 'pause.resume' : 'pause.pause')">
        <svg viewBox="0 0 24 24" x-show="!prefs.paused"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
        <svg viewBox="0 0 24 24" x-show="prefs.paused"><path d="M7 4.5v15l12-7.5z"/></svg>
      </button>
      <!-- a file request: someone outside the group sends files through a link -->
      <button class="icon" x-show="canDrop" @click="openDrop()" :aria-label="t('drop.open')" :title="t('drop.open')">
        <svg viewBox="0 0 24 24"><path d="M12 3v9m-4-4 4 4 4-4"/><path d="M3 14h5l2 3h4l2-3h5v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
      </button>
      <button class="icon" x-show="history.length" @click="openSearch" :aria-label="t('search')" :title="searchTitle">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      </button>
      <button class="icon" @click="openSettings" :aria-label="t('settings')" :title="t('settings')">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      </button>
      </div>
    </header>
    <!-- searching: the type chips and the count, instead of what is above the history -->
    <div class="search-tools" x-show="search.open" x-cloak>
      <div class="chips" x-show="searchTypes.length" role="group" :aria-label="t('search.types')">
        <template x-for="c in searchTypes" :key="c.value">
          <button :class="searchTypeClass(c)" @click="setSearchType(c.value)" :aria-pressed="search.type === c.value ? 'true' : 'false'" x-text="c.label"></button>
        </template>
      </div>
      <p class="search-count" x-show="searchActive && shown.length" x-text="searchCount"></p>
    </div>
    <div class="above-history" x-show="!search.open">
    <p class="status" x-text="statusText"></p>
    <div class="update" x-show="update">
      <span x-text="t('update.available', { v: update })"></span>
      <button class="small ghost" x-show="updateNews.length" @click="toggleUpdateNews" :aria-expanded="updateNewsOpen ? 'true' : 'false'" x-text="t('update.news')"></button>
      <a class="button small secondary" :href="updateUrl" x-text="t('update.download')"></a>
      <button class="small ghost" @click="dismissUpdate" x-text="t('update.later')"></button>
      <div class="news-list" x-show="updateNewsOpen && updateNews.length">
        <template x-for="e in updateNews" :key="e.version">
          <div>
            <p class="news-version" x-show="updateNews.length > 1" x-text="e.version"></p>
            <ul><template x-for="c in newsItems(e)" :key="c"><li x-rich="c"></li></template></ul>
          </div>
        </template>
      </div>
    </div>
    <!-- after an update, once: what it brought -->
    <div class="news" x-show="whatsNew.length">
      <strong x-text="whatsNewTitle"></strong>
      <div class="news-list">
        <template x-for="e in whatsNew" :key="e.version">
          <div>
            <p class="news-version" x-show="whatsNew.length > 1" x-text="e.version"></p>
            <ul><template x-for="c in newsItems(e)" :key="c"><li x-rich="c"></li></template></ul>
          </div>
        </template>
      </div>
      <button class="small secondary" @click="dismissWhatsNew" x-text="t('news.ok')"></button>
    </div>

    <div class="actions">
      <button class="primary" x-show="manualClipboard" @click="sendClipboard" :disabled="!canSendText">
        <svg viewBox="0 0 24 24"><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="M12 11v6M9 14l3-3 3 3"/></svg>
        <span x-text="t('sendClipboard')"></span>
      </button>
      <div class="file-pick">
        <button class="secondary" @click="onFileButton" :aria-expanded="fileMenu ? 'true' : 'false'">
          <svg viewBox="0 0 24 24"><path d="m21.4 11.1-9.2 9.2a6 6 0 0 1-8.5-8.5l9.2-9.2a4 4 0 0 1 5.7 5.7l-9.2 9.2a2 2 0 0 1-2.8-2.8l8.5-8.5"/></svg>
          <span x-text="t('file')"></span>
          <svg class="caret" viewBox="0 0 24 24" x-show="mobile && canPickFolder"><path d="m6 9 6 6 6-6"/></svg>
        </button>
        <!-- phones: files or a folder -->
        <div class="menu" x-show="fileMenu" @click.outside="closeFileMenu" role="menu">
          <button role="menuitem" @click="pickFiles">
            <svg viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></svg>
            <span x-text="t('file.files')"></span>
          </button>
          <button role="menuitem" @click="pickFolder">
            <svg viewBox="0 0 24 24"><path d="M3 7.5A2.5 2.5 0 0 1 5.5 5H9l2 2.2h7.5A2.5 2.5 0 0 1 21 9.7v7.8a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 17.5z"/></svg>
            <span x-text="t('file.folder')"></span>
          </button>
        </div>
      </div>
      <!-- computers: a button of its own -->
      <button class="secondary" x-show="canPickFolder && !mobile" @click="pickFolder">
        <svg viewBox="0 0 24 24"><path d="M3 7.5A2.5 2.5 0 0 1 5.5 5H9l2 2.2h7.5A2.5 2.5 0 0 1 21 9.7v7.8a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 17.5z"/></svg>
        <span x-text="t('folder')"></span>
      </button>
      <input type="file" multiple hidden x-ref="file" @change="onFiles($event)">
      <input type="file" webkitdirectory hidden x-ref="folder" @change="onFolderInput($event)">
    </div>
    <p class="hint" x-show="desktop && shareHint" :class="prefs.paused ? 'paused' : ''" x-text="shareHint"></p>

    <div class="note">
      <textarea x-ref="note" rows="1" spellcheck="false" :maxlength="noteMax"
                :placeholder="t('note.placeholder')" @input="onNoteInput($event)"></textarea>
      <div class="note-bar" x-show="!noteEmpty">
        <span x-text="noteInfo"></span>
        <button class="small ghost" @click="sendNote" :disabled="!canSendText" x-text="t('send')"></button>
        <button class="small ghost" @click="copyNote" x-text="t('copy')"></button>
        <button class="small ghost danger" @click="clearNote" :title="t('note.clearTitle')"
                x-text="t(isConfirming('note') ? 'note.clearEverywhere' : 'note.clear')"></button>
      </div>
    </div>

    <p class="alert" x-show="storageLow" x-text="t('storage.low', { space: storageText })"></p>

    <template x-for="tr in transfers" :key="tr.id">
      <div class="transfer" :class="tr.error ? 'error' : ''">
        <span class="transfer-name" x-text="transferLabel(tr)"></span>
        <span class="transfer-state">
          <svg class="ring" viewBox="0 0 36 36" x-show="!tr.error" aria-hidden="true">
            <circle class="ring-track" cx="18" cy="18" r="15.9155"/>
            <circle class="ring-bar" cx="18" cy="18" r="15.9155" pathLength="100" stroke-dasharray="100" :stroke-dashoffset="ringOffset(tr)"/>
          </svg>
          <span x-text="transferState(tr)"></span>
        </span>
        <button class="small ghost" x-show="tr.error" @click="dismissTransfer(tr)" x-text="t('close')"></button>
      </div>
    </template>

    <div class="history-bar" x-show="canClearAll">
      <button class="ghost danger small" @click="clearAll"
              x-text="t(isConfirming('clear') ? 'clearAll.confirm' : 'clearAll')"></button>
    </div>
    </div>
    <ul class="history">
      <template x-for="item in shown" :key="item.id">
        <li class="item" :class="itemClass(item)">
          <!-- a share link made here: only this device sees it -->
          <template x-if="item.share">
            <div class="entry">
              <button class="thumb link-tile" @click="openShare(item.share)" :aria-label="t('share.show')" :title="t('share.show')">
                <img x-show="shareThumb(item.share)" :src="shareThumb(item.share)" alt="">
                <span class="link-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></svg></span>
              </button>
              <div class="body">
                <p class="content" :class="item.share.kind === 'text' ? 'text' : 'file'"><template x-for="(p, i) in shareParts(item.share)" :key="i"><span :class="hitClass(p)" x-text="p.text"></span></template></p>
                <p class="meta link-meta" x-text="shareMeta(item.share)"></p>
              </div>
              <div class="item-actions">
                <button class="small secondary" @click="copyShareLink(item.share)" x-text="t('share.copyLink')"></button>
                <button class="small secondary" @click="openShare(item.share)" x-text="t('share.show')"></button>
                <button class="small ghost danger" @click="removeShare(item.share)"
                        x-text="t(isConfirming(shareKey(item.share)) ? 'share.deleteConfirm' : 'delete')"></button>
              </div>
            </div>
          </template>
          <!-- a file request of the group, open: on every device, on top -->
          <template x-if="item.request">
            <div class="entry">
              <button class="thumb drop-tile" @click="openDrop(item.request)" :aria-label="t('share.show')" :title="t('share.show')">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v9m-4-4 4 4 4-4"/><path d="M3 14h5l2 3h4l2-3h5v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
              </button>
              <div class="body">
                <p class="content file"><template x-for="(p, i) in requestParts(item.request)" :key="i"><span :class="hitClass(p)" x-text="p.text"></span></template></p>
                <p class="meta link-meta" x-text="requestMeta(item.request)"></p>
              </div>
              <div class="item-actions">
                <button class="small secondary" @click="copyDropLink(item.request)" x-text="t('share.copyLink')"></button>
                <button class="small secondary" @click="openDrop(item.request)" x-text="t('share.show')"></button>
                <button class="small ghost danger" @click="removeDrop(item.request)"
                        x-text="t(isConfirming(dropKey(item.request)) ? 'share.deleteConfirm' : 'delete')"></button>
              </div>
            </div>
          </template>
          <template x-if="!item.share && !item.request">
          <div class="entry">
          <!-- receipts: one tick once a recipient has it, two once all have it; coloured once read -->
          <div class="receipts" x-show="hasReceipts(item)" @click.outside="closeReceiptsOf(item)">
            <button class="ticks" @click="toggleReceipts(item)" :aria-label="receiptsTitle(item)" :title="receiptsTitle(item)"
                    :aria-expanded="receiptsShown(item)">
              <svg viewBox="0 0 17 11" aria-hidden="true"><path :class="tickClass(item, 1)" d="M1 5.6 4.4 9 11 1.8"/><path :class="tickClass(item, 2)" d="M7.6 8.2 8.4 9 15 1.8"/></svg>
            </button>
            <div class="receipts-detail" x-show="receiptsShown(item)" x-cloak>
              <p x-text="t('receipt.title')"></p>
              <ul>
                <template x-for="dev in receiptDevices(item)" :key="dev.id">
                  <li :class="receiptClass(dev)"><span x-text="receiptName(dev)"></span><span x-text="receiptState(dev)"></span></li>
                </template>
              </ul>
            </div>
          </div>
          <template x-if="hasTile(item)">
            <button :class="tileClass(item)" @click="openTile(item)" :disabled="tileDisabled(item)"
                    :aria-label="openTitle(item)" :title="openTitle(item)">
              <img x-show="item.thumb" :src="item.thumb" alt="">
              <span class="folder-mark" x-show="item.kind === 'folder' && !item.thumb" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M3 7.5A2.5 2.5 0 0 1 5.5 5H9l2 2.2h7.5A2.5 2.5 0 0 1 21 9.7v7.8a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 17.5z"/></svg></span>
              <span class="page" x-show="!item.thumb && !isVideo(item) && !isAudio(item) && item.kind !== 'folder'" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
              <span class="note" x-show="!item.thumb && isAudio(item)" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg></span>
              <span class="play" x-show="isVideo(item)" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M7 4.5v15l12-7.5z"/></svg></span>
              <span class="badge" x-show="badge(item)" x-text="badge(item)"></span>
            </button>
          </template>
          <div class="body">
            <p class="content" :class="item.kind === 'text' ? 'text' : 'file'"><template x-for="(p, i) in labelParts(item)" :key="i"><span :class="hitClass(p)" x-text="p.text"></span></template></p>
            <p class="excerpt" x-show="item.excerpt"><template x-for="(p, i) in excerptParts(item)" :key="i"><span :class="hitClass(p)" x-text="p.text"></span></template></p>
            <p class="meta">
              <span><svg class="pin-mark" x-show="item.pinned" viewBox="0 0 24 24" role="img" :aria-label="t('pin.pinned')"><path d="M9 3h6l-1 6 3 3v2H7v-2l3-3z"/><path d="M12 14v7"/></svg><svg class="from-drop" x-show="item.drop" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v9m-4-4 4 4 4-4"/><path d="M3 14h5l2 3h4l2-3h5v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg><template x-for="(p, i) in fromParts(item)" :key="i"><span :class="hitClass(p)" x-text="p.text"></span></template></span> ·
              <span x-text="ago(item)"></span> ·
              <span x-show="item.kind === 'folder'" x-text="folderCount(item) + ' ·'"></span>
              <span x-show="sizeOf(item)" x-text="sizeOf(item) + ' ·'"></span>
              <span x-text="left(item)"></span>
            </p>
          </div>
          <div class="item-actions">
            <button class="small primary" x-show="canBrowse(item)" @click="openFolder(item)" x-text="t('folder.browse')"></button>
            <button class="small secondary" x-show="canBrowse(item) && !downloading(item)" @click="downloadFolder(item)" x-text="t('folder.downloadAll')"></button>
            <button :class="openClass(item)" x-show="opensFirst(item) && !downloading(item)" @click="openPreview(item)" x-text="openLabel(item)"></button>
            <button class="small primary" x-show="linkFirst(item)" @click="openLink(item)" :title="linkTitle(item)" x-text="t('link.open')"></button>
            <button class="small primary" x-show="opensOutside(item) && !downloading(item)" @click="openWith(item)" :title="openWithTitle(item)" x-text="t('openWith')"></button>
            <button :class="copyClass(item)" x-show="canCopy(item) && !downloading(item)" @click="copy(item)" x-text="t('copy')"></button>
            <button class="small secondary" x-show="linkAfter(item)" @click="openLink(item)" :title="linkTitle(item)" x-text="t('link.open')"></button>
            <button :class="openClass(item)" x-show="previewOf(item) && !opensFirst(item) && !downloading(item)" @click="openPreview(item)" x-text="openLabel(item)"></button>
            <button class="small secondary" x-show="item.canPublish" @click="publish(item)" x-text="t('publish')"></button>
            <button class="small secondary" x-show="canSave(item) && !downloading(item)" @click="save(item)" x-text="t('save')"></button>
            <span class="transfer-state download" x-show="downloading(item)" :title="t('downloading')">
              <svg class="ring" viewBox="0 0 36 36" aria-hidden="true">
                <circle class="ring-track" cx="18" cy="18" r="15.9155"/>
                <circle class="ring-bar" cx="18" cy="18" r="15.9155" pathLength="100" stroke-dasharray="100" :stroke-dashoffset="downloadOffset(item)"/>
              </svg>
              <span x-text="downloadProgress(item)"></span>
            </span>
            <!-- pinned: on top of the history, on every device; an old item goes once unpinned (asked first) -->
            <button :class="pinClass(item)" x-show="canPin(item)" @click="togglePin(item)" :aria-label="pinLabel(item)" :title="pinTitle(item)"
                    :aria-pressed="item.pinned ? 'true' : 'false'">
              <svg x-show="!pinConfirming(item)" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3h6l-1 6 3 3v2H7v-2l3-3z"/><path d="M12 14v7"/></svg>
              <span x-show="pinConfirming(item)" x-text="t('pin.confirm')"></span>
            </button>
            <!-- a QR code made here, for a device outside the group (nothing goes through the relay) -->
            <button class="small ghost icon-only" x-show="canQr(item)" @click="showQr(item)" :aria-label="t('qr.show')" :title="t('qr.show')">
              <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3v3h-3zM20 14v.01M14 20v.01M17 17h4v4h-4"/></svg>
            </button>
            <button class="small ghost icon-only" x-show="canShare(item)" @click="shareItem(item)" :aria-label="t('share')" :title="t('share')">
              <svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 13.5 6.8 4M15.4 6.5l-6.8 4"/></svg>
            </button>
            <button class="small ghost danger" @click="remove(item)" :title="t('item.deleteTitle')"
                    x-text="t(isConfirming(itemKey(item)) ? 'deleteEverywhere' : 'delete')"></button>
          </div>
          </div>
          </template>
        </li>
      </template>
    </ul>
    <p class="empty" x-show="history.length === 0 && !search.open" x-text="t('empty')"></p>
    <div class="empty search-empty" x-show="searchActive && !shown.length">
      <p x-text="searchNone"></p>
      <button class="small secondary" @click="clearSearchAll" x-text="t('search.reset')"></button>
    </div>
    <div class="drop" x-show="dragging" x-text="t('drop')"></div>
  </section>

  <!-- Settings -->
  <section class="page settings" x-show="view === 'settings'">
    <header class="bar">
      <button class="icon" @click="back" :aria-label="t('back')" :title="t('back')">
        <svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>
      </button>
      <strong x-text="t('settings')"></strong>
      <span></span>
    </header>

    <h2 x-text="t('settings.device')"></h2>
    <label class="field"><span x-text="t('settings.name')"></span>
      <input type="text" :value="device.name" @change="renameDevice($event)" maxlength="40">
    </label>
    <label class="switch" x-show="desktop">
      <input type="checkbox" :checked="prefs.autoShare" @change="toggleAutoShare">
      <span x-text="t('settings.autoShare')"></span>
    </label>
    <label class="switch" x-show="desktop">
      <input type="checkbox" :checked="prefs.notify" @change="toggleNotify">
      <span x-text="t('settings.notify')"></span>
    </label>
    <label class="switch" x-show="canAutostart">
      <input type="checkbox" :checked="autostart" @change="toggleAutostart">
      <span x-text="t('settings.autostart')"></span>
    </label>
    <label class="switch">
      <input type="checkbox" :checked="prefs.confirmDelete" @change="toggleConfirmDelete">
      <span x-text="t('settings.confirmDelete')"></span>
    </label>
    <label class="field"><span x-text="t('settings.language')"></span>
      <select @change="setLanguage($event)">
        <option value="" x-text="t('settings.languageAuto')" :selected="isLangChoice('')"></option>
        <template x-for="code in langs" :key="code">
          <option :value="code" :lang="code" x-text="langNames[code]" :selected="isLangChoice(code)"></option>
        </template>
      </select>
    </label>

    <template x-if="group">
      <div>
        <h2 x-text="t('settings.group')"></h2>
        <label class="field"><span x-text="t('settings.groupName')"></span>
          <input type="text" :value="group.name" @change="renameGroup($event)" maxlength="40">
        </label>
        <label class="field"><span x-text="t('settings.ttl')"></span>
          <select @change="setTtl($event)">
            <template x-for="c in ttlOptions" :key="c.value">
              <option :value="c.value" x-text="c.label" :selected="c.value === group.ttl"></option>
            </template>
          </select>
        </label>
        <label class="field"><span x-text="t('settings.maxItems')"></span>
          <select @change="setMaxItems($event)">
            <template x-for="c in maxItemsChoices" :key="c.value">
              <option :value="c.value" x-text="c.label" :selected="c.value === group.maxItems"></option>
            </template>
          </select>
        </label>
        <label class="field"><span x-text="t('settings.autoMax')"></span>
          <select @change="setAutoMax($event)">
            <template x-for="c in autoMaxChoices" :key="c.value">
              <option :value="c.value" x-text="c.label" :selected="c.value === group.autoMax"></option>
            </template>
          </select>
        </label>
        <p class="muted small" x-text="t(mac ? 'settings.autoMaxHintMac' : 'settings.autoMaxHint')"></p>
        <label class="switch">
          <input type="checkbox" :checked="group.localOnly" @change="toggleLocalOnly">
          <span x-text="t('settings.localOnly')"></span>
        </label>
        <p class="muted small" x-text="t('settings.localOnlyHint')"></p>

        <h3 x-text="t('settings.devices')"></h3>
        <ul class="members">
          <template x-for="m in group.members" :key="m.id">
            <li>
              <span class="dot" :class="m.online ? 'on' : 'off'"></span>
              <span class="name" x-text="m.me ? t('settings.thisDevice', { name: m.name }) : m.name"></span>
              <span class="muted small" x-text="platformLabel(m.platform)"></span>
              <button class="small ghost danger" @click="removeMember(m)"
                      x-text="t(isConfirming(memberKey(m)) ? 'confirm' : (m.me ? 'settings.leave' : 'settings.remove'))"></button>
            </li>
          </template>
        </ul>
        <p class="muted small" x-text="t('settings.removeHint')"></p>
        <button class="primary wide" @click="showInvite" x-text="t('invite')"></button>
      </div>
    </template>

    <h2 x-text="t('settings.groups')"></h2>
    <ul class="groups">
      <template x-for="g in groups" :key="g.id">
        <li :class="g.id === groupId ? 'current' : ''" @click="selectGroup(g.id)">
          <span x-text="g.name"></span>
          <span class="muted small" x-text="deviceCount(g)"></span>
        </li>
      </template>
    </ul>
    <div class="inline">
      <input type="text" :placeholder="t('settings.newGroup')" x-model="newGroupName" maxlength="40">
      <button class="secondary" @click="createGroup" x-text="t('create')"></button>
    </div>
    <div class="inline">
      <input type="url" :placeholder="t('inviteLink')" x-model="joinLink">
      <button class="secondary" @click="joinFromLink" x-text="t('join')"></button>
    </div>
    <button class="secondary wide" x-show="!desktop" @click="startScan" x-text="t('scan')"></button>
    <button class="ghost wide" x-show="canInstall" @click="install" x-text="t('install')"></button>

    <h2 x-text="t('settings.server')"></h2>
    <p class="muted small" x-show="storageText" x-text="t('settings.space', { space: storageText })"></p>
    <div class="meter" x-show="storageText" :class="storageLow ? 'low' : ''"><span :style="storageBar"></span></div>
    <p class="muted small" x-text="group ? group.relay : ''"></p>
    <p class="muted small" x-show="relayVersionText" x-text="relayVersionText"></p>
    <p class="muted small" x-text="t(group && group.persist ? 'settings.persist' : 'settings.noPersist')"></p>
    <template x-if="native">
      <div>
        <label class="field"><span x-text="t('settings.relay')"></span>
          <input type="url" x-model="relayInput" placeholder="https://" autocomplete="off" spellcheck="false">
        </label>
        <button class="secondary wide" @click="saveRelay" :disabled="busy" x-text="t('settings.changeRelay')"></button>
        <p class="muted small" x-text="t('settings.relayHint')"></p>
      </div>
    </template>

    <p class="muted small" x-text="t('settings.version', { v: version })"></p>
    <div class="donate" x-show="donate">
      <p class="muted small" x-text="t('donate.text')"></p>
      <a class="button small secondary" href="https://liberapay.com/0xdba/donate" x-text="t('donate.button')"></a>
    </div>

    <button class="ghost danger wide" @click="resetAll"
            x-text="t(isConfirming('reset') ? 'settings.resetConfirm' : 'settings.reset')"></button>
  </section>

  <!-- Invitation -->
  <section class="center page" x-show="view === 'invite'">
    <h1 x-text="t('invite')"></h1>
    <p class="muted" x-text="t('invite.scanHint')"></p>
    <img class="qr" :src="inviteQr" :alt="t('invite.qrAlt')" x-show="inviteQr">
    <p class="muted small" x-text="t('invite.valid', { left: inviteLeft })"></p>
    <input class="link" type="text" readonly :value="inviteUrl" @focus="$event.target.select()">
    <button class="ghost" @click="back" x-text="t('cancel')"></button>
  </section>

  <!-- Share link of an item, for someone outside the group: slides in over the history -->
  <section class="center page share-page" x-show="view === 'share'">
    <h1 x-text="t('share.title')"></h1>
    <p class="share-name" x-text="shareName"></p>
    <p class="muted" x-text="t('share.hint')"></p>
    <img class="qr" :src="shareQr" :alt="t('share.qrAlt')" x-show="shareQr">
    <p class="qr-wait muted small" x-show="!shareQr" x-text="t('share.creating')"></p>
    <div class="share-ttl" x-show="share">
      <span class="muted small" x-text="t('share.valid')"></span>
      <div class="segmented" role="group" :aria-label="t('share.valid')">
        <template x-for="o in shareTtls" :key="o.value">
          <button :aria-pressed="o.pressed" @click="setShareTtl(o.value)" x-text="o.label"></button>
        </template>
      </div>
    </div>
    <p class="muted small" x-show="share" x-text="shareLeft"></p>
    <input class="link" type="text" readonly :value="share ? share.url : ''" @focus="$event.target.select()" x-show="share">
    <button class="primary" x-show="share" @click="copyShownLink" x-text="t('share.copyLink')"></button>
    <p class="muted small" x-text="t('share.anyone')"></p>
    <div class="share-bottom">
      <button class="ghost" @click="closeShare" x-text="t('back')"></button>
      <button class="ghost danger" x-show="share" @click="removeShownShare"
              x-text="t(removingShownShare ? 'share.deleteConfirm' : 'share.delete')"></button>
    </div>
  </section>

  <!-- A text as a QR code, made on this device: slides in over the history -->
  <section class="center page qr-page" x-show="view === 'qr'">
    <h1 x-text="t('qr.title')"></h1>
    <p class="share-name" x-text="qrName"></p>
    <p class="muted" x-text="t(qrLink ? 'qr.hintLink' : 'qr.hint')"></p>
    <img class="qr" :src="qrImg" :alt="t('qr.alt')" x-show="qrImg">
    <p class="qr-wait muted small" x-show="!qrImg" x-text="t('qr.reading')"></p>
    <p class="muted small" x-text="t('qr.local')"></p>
    <div class="share-bottom">
      <button class="ghost" @click="closeQr" x-text="t('back')"></button>
    </div>
  </section>

  <!-- File request of the group, for someone outside it: slides in over the history -->
  <section class="center page drop-page" x-show="view === 'drop'">
    <h1 x-text="t('drop.title')"></h1>
    <p class="muted" x-text="t('drop.hint')"></p>
    <label class="field drop-msg" x-show="drop"><span x-text="t('drop.message')"></span>
      <input type="text" :maxlength="dropMessageMax" :placeholder="t('drop.messagePlaceholder')"
             :value="drop ? (drop.msg || '') : ''" @change="setDropMessage($event)" enterkeyhint="done">
    </label>
    <img class="qr" :src="dropQr" :alt="t('drop.qrAlt')" x-show="dropQr">
    <p class="qr-wait muted small" x-show="!dropQr" x-text="t('share.creating')"></p>
    <div class="share-ttl" x-show="drop">
      <span class="muted small" x-text="t('share.valid')"></span>
      <div class="segmented" role="group" :aria-label="t('share.valid')">
        <template x-for="o in dropTtls" :key="o.value">
          <button :aria-pressed="o.pressed" @click="setDropTtl(o.value)" x-text="o.label"></button>
        </template>
      </div>
    </div>
    <p class="muted small" x-show="drop" x-text="dropLeft"></p>
    <input class="link" type="text" readonly :value="drop ? drop.url : ''" @focus="$event.target.select()" x-show="drop">
    <button class="primary" x-show="drop" @click="copyShownDropLink" x-text="t('share.copyLink')"></button>
    <p class="muted small" x-text="t('drop.anyone')"></p>
    <div class="share-bottom">
      <button class="ghost" @click="closeDrop" x-text="t('back')"></button>
      <button class="ghost danger" x-show="drop" @click="removeShownDrop"
              x-text="t(removingShownDrop ? 'share.deleteConfirm' : 'share.delete')"></button>
    </div>
  </section>

  <!-- QR scanner -->
  <section class="scan" x-show="view === 'scan'">
    <video x-ref="video" playsinline muted></video>
    <div class="frame"></div>
    <p class="scan-error" x-show="scanError" x-text="scanError"></p>
    <button class="secondary" @click="stopScan" x-text="t('cancel')"></button>
  </section>

  <!-- A shared folder: its browser (over the history); the viewer opens over it -->
  <section class="folder-page" x-show="folderView.open" role="dialog" aria-modal="true">
    <div class="folder-state" x-show="folderView.loading || folderView.error">
      <header class="viewer-bar">
        <button class="icon" @click="closeFolder" :aria-label="t('back')" :title="t('back')">
          <svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>
        </button>
        <div class="viewer-title"><strong x-text="t('folder.loading')"></strong></div>
        <span></span>
      </header>
      <p class="viewer-error" x-show="folderView.error" x-text="folderView.error"></p>
      <p class="muted center" x-show="!folderView.error" x-text="t('folder.loading')"></p>
    </div>
    <div class="folder-browser" x-ref="folderBox" x-show="!folderView.loading && !folderView.error"></div>
  </section>

  <!-- A large (or copied) folder: what it holds, before it is sent -->
  <div class="sheet-backdrop" x-show="folderAsk" @click.self="cancelFolder">
    <div class="sheet" role="dialog" aria-modal="true">
      <div class="sheet-head">
        <span class="sheet-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M3 7.5A2.5 2.5 0 0 1 5.5 5H9l2 2.2h7.5A2.5 2.5 0 0 1 21 9.7v7.8a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 17.5z"/></svg></span>
        <strong x-text="folderAsk ? t(folderAsk.copied ? 'folder.askCopied' : 'folder.ask', { name: folderAsk.name }) : ''"></strong>
      </div>
      <p x-text="folderAskText"></p>
      <p class="sheet-note" x-show="folderAskSpace" x-text="folderAskSpace"></p>
      <p class="sheet-note" x-show="folderAskIgnored" x-text="folderAskIgnored"></p>
      <p class="alert" x-show="folderAskTooBig" x-text="t('folder.tooBig')"></p>
      <div class="row">
        <button class="ghost" @click="cancelFolder" x-text="t('cancel')"></button>
        <button class="primary" @click="confirmFolder" :disabled="folderAskTooBig" x-text="t('folder.send')"></button>
      </div>
    </div>
  </div>

  <!-- Preview of an item: image, video, text, Markdown (over the history) -->
  <section :class="viewerClass" x-show="viewer.open" role="dialog" aria-modal="true" :aria-label="viewerName"
           @touchstart="onSwipeStart($event)" @touchend="onSwipeEnd($event)">
    <header class="viewer-bar">
      <button class="icon" @click="closeViewer" :aria-label="t('back')" :title="t('back')">
        <svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>
      </button>
      <div class="viewer-title">
        <strong x-text="viewerName"></strong>
        <span x-text="viewerMeta"></span>
      </div>
      <span class="viewer-count" x-show="viewerTotal > 1" x-text="viewerCount"></span>
    </header>

    <div class="viewer-tools" x-show="viewerIs('pdf') && viewer.pages > 0">
      <span class="pdf-count" x-text="pdfPageLabel"></span>
      <div class="segmented" role="group">
        <button @click="pdfZoomOut" :disabled="viewer.zoom <= 1" :aria-label="t('viewer.zoomOut')" :title="t('viewer.zoomOut')">−</button>
        <button class="zoom" @click="pdfZoomReset" :aria-label="t('viewer.zoomFit')" :title="t('viewer.zoomFit')" x-text="pdfZoomLabel"></button>
        <button @click="pdfZoomIn" :disabled="viewer.zoom >= 3" :aria-label="t('viewer.zoomIn')" :title="t('viewer.zoomIn')">+</button>
      </div>
    </div>
    <div class="viewer-tools" x-show="viewerIs('markdown') || viewerIs('text')">
      <div class="segmented" role="group" x-show="viewerIs('markdown')">
        <button :aria-pressed="isRendered() ? 'true' : 'false'" @click="showRendered" x-text="t('viewer.rendered')"></button>
        <button :aria-pressed="isRendered() ? 'false' : 'true'" @click="showSource" x-text="t('viewer.source')"></button>
      </div>
      <label class="switch" x-show="viewerLines">
        <input type="checkbox" :checked="viewer.wrap" @change="toggleWrap">
        <span x-text="t('viewer.wrap')"></span>
      </label>
    </div>

    <div class="viewer-media">
      <img class="viewer-blur" x-show="viewerThumb" :src="viewerThumb" alt="">
      <img class="viewer-image" x-show="viewerIs('image') && viewer.src" :src="viewer.src" :alt="viewerName" @error="onViewerImageError">
      <video x-ref="player" class="viewer-video" x-show="viewerIs('video') && !viewer.error" :controls="videoControls" playsinline preload="metadata"></video>
      <!-- a song: its player, the previous and next songs, the loop; then what comes next -->
      <div class="viewer-audio" x-show="viewerIs('audio')">
        <span class="note" aria-hidden="true" x-show="!viewer.error"><svg viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg></span>
        <audio x-ref="audio" controls preload="metadata" x-show="!viewer.error"></audio>
        <p class="audio-error" x-show="viewer.error" x-text="viewer.error"></p>
        <div class="audio-controls">
          <div class="audio-skip">
            <button class="icon" @click="audioPrev" :aria-label="t('audio.prev')" :title="t('audio.prev')">
              <svg viewBox="0 0 24 24"><path d="M19 20 9 12l10-8z"/><path d="M5 19V5"/></svg>
            </button>
            <button class="icon" @click="audioNext" :disabled="!audioHasNext" :aria-label="t('audio.next')" :title="t('audio.next')">
              <svg viewBox="0 0 24 24"><path d="m5 4 10 8-10 8z"/><path d="M19 5v14"/></svg>
            </button>
          </div>
          <button :class="loopClass" @click="cycleLoop" :aria-label="loopTitle" :title="loopTitle">
            <svg viewBox="0 0 24 24"><path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/></svg>
            <span x-text="loopShort"></span>
          </button>
        </div>
        <div class="audio-queue" x-show="audioQueue.length > 1">
          <span class="label" x-text="t('audio.upNext')"></span>
          <template x-for="q in audioQueue" :key="q.id">
            <button :class="q.cls" @click="openQueued(q)"><span x-text="q.name"></span><span x-text="q.time"></span></button>
          </template>
        </div>
      </div>
      <div class="pdf-pages" x-ref="pdf" x-show="viewerIs('pdf') && !viewer.error" @scroll="onPdfScroll"></div>
      <article class="markdown" x-ref="md" x-show="viewerRendered"></article>
      <div class="lines" x-ref="lines" x-show="viewerLines" :aria-label="t('viewer.text')"></div>
      <div class="viewer-state" x-show="viewer.loading && !viewerIs('video') && !viewerIs('audio')">
        <span x-text="viewerProgress || t('viewer.loading')"></span>
      </div>
      <p class="viewer-error" x-show="viewer.error && !viewerIs('audio')" x-text="viewer.error"></p>
      <button class="nav prev" x-show="viewerTotal > 1 && viewerIndex > 0" @click="viewerPrev" :aria-label="t('viewer.prev')" :title="t('viewer.prev')">
        <svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>
      </button>
      <button class="nav next" x-show="viewerTotal > 1 && viewerIndex < viewerTotal - 1" @click="viewerNext" :aria-label="t('viewer.next')" :title="t('viewer.next')">
        <svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg>
      </button>
      <!-- Linux, Windows: the window is the small one; back to the full window -->
      <button class="pip-back" x-show="pipMode && platform !== 'android'" @click="exitPip" :aria-label="t('viewer.pipBack')" :title="t('viewer.pipBack')">
        <svg viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M14 10h-4v4M10 14l6-6"/></svg>
      </button>
    </div>

    <p class="viewer-note" x-show="viewer.note" x-text="viewer.note"></p>

    <div class="viewer-actions">
      <template x-if="viewerIs('video') && viewer.canPip && !viewer.error">
        <div class="pip-offer">
          <button class="primary wide" @click="startPip">
            <svg viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2"/><rect x="12" y="11" width="7" height="6" rx="1" fill="currentColor"/></svg>
            <span x-text="t('viewer.pip')"></span>
          </button>
          <p class="hint" x-text="pipHint"></p>
        </div>
      </template>
      <div class="row">
        <button class="primary" x-show="viewerCanCopy" @click="viewerCopy" x-text="viewerCopyLabel"></button>
        <button :class="viewerOpenWithClass" x-show="viewerCanOpenWith" @click="viewerOpenWith" :title="viewerOpenWithTitle" x-text="t('openWith')"></button>
        <button class="secondary" @click="viewerSave" x-text="t('save')"></button>
        <button class="secondary" x-show="viewerIs('video') && !viewer.error" @click="fullscreen" x-text="t('viewer.fullscreen')"></button>
        <button class="ghost danger" x-show="!viewerInFolder" @click="viewerRemove" :aria-label="t('item.deleteTitle')" :title="t('item.deleteTitle')">
          <svg viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg>
          <span x-show="viewerRemoving" x-text="t('deleteEverywhere')"></span>
        </button>
      </div>
    </div>
  </section>

  <div class="toast" x-show="toastText" x-text="toastText"></div>
</div>
