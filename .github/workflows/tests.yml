# Type checking and end-to-end tests of the core against a real relay.
name: Tests

on:
  push:
    branches: [master]
    paths: [web/**, relay/**, Dockerfile, docker-compose.yml, .github/workflows/tests.yml]
  pull_request:
    paths: [web/**, relay/**, Dockerfile, docker-compose.yml]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Relais
        run: |
          mkdir -p downloads
          docker compose up -d --build
          for i in $(seq 30); do curl -sf http://127.0.0.1:8080/healthz && break; sleep 1; done
      - working-directory: web
        run: npm ci --no-audit --no-fund
      - working-directory: web
        run: npm run typecheck
      - working-directory: web
        run: npm test
