# Type checking, end-to-end tests of the core, of the command line and of the interface (Chrome)
# against a real relay.
name: Tests

on:
  push:
    branches: [master]
    paths: [web/**, relay/**, cli/**, scripts/**, CHANGELOG*.md, Dockerfile, docker-compose.yml, .github/workflows/tests.yml]
  pull_request:
    paths: [web/**, relay/**, cli/**, scripts/**, CHANGELOG*.md, Dockerfile, docker-compose.yml]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # the changelog's versions are checked against the number of commits
      # both languages, the same versions, none beyond this commit
      - name: Changelog
        run: node scripts/changelog.mjs check
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            cli/package-lock.json
      - name: Relais
        run: |
          # built with its version, as on a server (the app's "what's new" depends on it)
          docker compose build --build-arg APP_VERSION=0.1.$(git rev-list --count HEAD)
          docker compose up -d
          for i in $(seq 30); do curl -sf http://127.0.0.1:8080/healthz && break; sleep 1; done
      - working-directory: web
        run: npm ci --no-audit --no-fund
      - working-directory: web
        run: npm run typecheck
      - working-directory: web
        run: npm test
      # the command line: two terminal devices; built before the interface tests, which use it too
      - name: CLI
        working-directory: cli
        run: npm ci --no-audit --no-fund && npm run typecheck && npm run build && npm test
      # several browser devices (Chrome profiles) using the app served by the relay
      - working-directory: web
        run: npm run test:ui
