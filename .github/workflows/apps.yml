# Builds every app (Linux, Windows, Android, Mac) on each push to master, then publishes them as
# the latest GitHub release (version 0.1.<number of commits>), with the 9 before it: the landing
# page links to it, the relays announce it to the apps. The build packages themselves stay one
# day (storage quota); a newer push cancels the build still running. Pushes that only touch the
# documentation build nothing.
name: Applis

on:
  push:
    branches: [master]
    paths-ignore: ['**.md', 'docs/**', 'LICENSE']
  workflow_dispatch:

concurrency:
  group: apps-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.v.outputs.build }}
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: v
        run: |
          n=$(git rev-list --count HEAD)
          echo "build=$n" >> "$GITHUB_OUTPUT"
          echo "version=0.1.$n" >> "$GITHUB_OUTPUT"

  desktop:
    name: ${{ matrix.name }}
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-22.04
            bundles: deb,appimage
            artifact: Entre-Nous-linux
            path: |
              desktop/src-tauri/target/release/bundle/deb/*.deb
              desktop/src-tauri/target/release/bundle/appimage/*.AppImage
          - name: Windows
            os: windows-latest
            bundles: nsis
            artifact: Entre-Nous-windows
            path: out/*
    runs-on: ${{ matrix.os }}
    env:
      APP_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Interface web
        working-directory: web
        run: npm ci --no-audit --no-fund && npm run build
      - name: Dépendances Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev libdbus-1-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - name: Compilation
        working-directory: desktop/src-tauri
        shell: bash
        run: npx --yes @tauri-apps/cli@2 build --bundles ${{ matrix.bundles }} --config "{\"version\":\"$APP_VERSION\"}"
      # Windows, besides the installer: the same one with the web view inside (offline, for the
      # stores and the computers without WebView2), and the MSIX package for the Microsoft Store
      # (its identity: the repository's variables MSIX_*, from Partner Center), checked here.
      - name: Installeur hors ligne et paquet MSIX
        if: runner.os == 'Windows'
        working-directory: desktop/src-tauri
        shell: pwsh
        env:
          MSIX_IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME }}
          MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
          MSIX_PUBLISHER_NAME: ${{ vars.MSIX_PUBLISHER_NAME }}
        run: |
          $out = New-Item -ItemType Directory ../../out
          Copy-Item target/release/bundle/nsis/*-setup.exe "$out/Entre-Nous-windows.exe"
          @{ version = $env:APP_VERSION; bundle = @{ windows = @{ webviewInstallMode = @{ type = 'offlineInstaller' } } } } |
            ConvertTo-Json -Depth 5 | Set-Content offline.json
          npx --yes @tauri-apps/cli@2 bundle --bundles nsis --config offline.json
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Copy-Item target/release/bundle/nsis/*-setup.exe "$out/Entre-Nous-windows-offline.exe"
          ../msix/build.ps1 -Exe target/release/entre-nous.exe -Version $env:APP_VERSION -Out "$out/Entre-Nous-windows.msix" -Check
          Get-ChildItem $out
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error
          retention-days: 1

  android:
    name: Android
    needs: version
    runs-on: ubuntu-latest
    env:
      APP_VERSION: ${{ needs.version.outputs.version }}
      APP_BUILD: ${{ needs.version.outputs.build }}
      KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
      PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: Interface web
        working-directory: web
        run: npm ci --no-audit --no-fund && npm run build && npx cap sync android
      # Signed with the release key (secrets ANDROID_KEYSTORE, base64 of the .jks, and
      # ANDROID_KEYSTORE_PASSWORD); without them, an unsigned APK, which is not published.
      - name: Clé de signature
        if: env.KEYSTORE != ''
        run: |
          mkdir -p "$RUNNER_TEMP/signing"
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/signing/android-release.jks"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=entrenous\nkeyPassword=%s\n' \
            "$RUNNER_TEMP/signing/android-release.jks" "$PASSWORD" "$PASSWORD" \
            > "$RUNNER_TEMP/signing/android-signing.properties"
          echo "ENTRENOUS_SIGNING=$RUNNER_TEMP/signing/android-signing.properties" >> "$GITHUB_ENV"
      # the APK (downloads, F-Droid stores) and the bundle for Google Play (signed with the same
      # key: Play's upload key)
      - name: Compilation
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: Entre-Nous-android
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 1

  mac:
    name: Mac
    needs: version
    runs-on: macos-latest
    env:
      APP_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # build-app.sh counts the commits
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: web/package-lock.json
      - working-directory: web
        run: npm ci --no-audit --no-fund
      - name: Compilation (Apple silicon + Intel, signature ad hoc)
        run: UNIVERSAL=1 macos/build-app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Entre-Nous-mac
          path: downloads/Entre-Nous-mac.zip
          if-no-files-found: error
          retention-days: 1

  cli:
    name: CLI
    needs: version
    runs-on: ubuntu-latest
    env:
      APP_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            cli/package-lock.json
      - name: Moteur (web/src/core)
        working-directory: web
        run: npm ci --no-audit --no-fund
      # one file, no dependency: dist/entrenous.mjs, packed for npm (prepack builds it)
      - name: Paquet
        working-directory: cli
        run: |
          npm ci --no-audit --no-fund
          npm version "$APP_VERSION" --no-git-tag-version
          npm pack
          mv "entrenous-$APP_VERSION.tgz" entrenous-cli.tgz
      - uses: actions/upload-artifact@v4
        with:
          name: Entre-Nous-cli
          path: cli/entrenous-cli.tgz
          if-no-files-found: error
          retention-days: 1

  # The latest release: the files under fixed names (…/releases/latest/download/<name>); the 10
  # latest kept (winget, Homebrew and the stores link to a version's files), the older ones
  # deleted with their tags.
  release:
    name: Publication
    needs: [version, desktop, android, mac, cli]
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      # the changelog: release notes, and changelog.json (the relay gives it to the apps)
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            CHANGELOG.md
            CHANGELOG.en.md
            scripts/changelog.mjs
          sparse-checkout-cone-mode: false
          path: src
      - uses: actions/download-artifact@v5
        with:
          path: in
      - name: Fichiers
        run: |
          mkdir out
          if [ ! -f in/Entre-Nous-android/apk/release/app-release.apk ]; then
            echo "::error::APK non signé : ajouter les secrets ANDROID_KEYSTORE et ANDROID_KEYSTORE_PASSWORD"
            exit 1
          fi
          cp in/Entre-Nous-android/apk/release/app-release.apk out/Entre-Nous-android.apk
          cp in/Entre-Nous-android/bundle/release/app-release.aab out/Entre-Nous-android.aab
          cp in/Entre-Nous-mac/Entre-Nous-mac.zip out/Entre-Nous-mac.zip
          cp in/Entre-Nous-windows/Entre-Nous-windows.exe in/Entre-Nous-windows/Entre-Nous-windows-offline.exe \
            in/Entre-Nous-windows/Entre-Nous-windows.msix out/
          cp in/Entre-Nous-linux/deb/*.deb out/Entre-Nous-linux.deb
          cp in/Entre-Nous-linux/appimage/*.AppImage out/Entre-Nous-linux.AppImage
          cp in/Entre-Nous-cli/entrenous-cli.tgz out/entrenous-cli.tgz
          node src/scripts/changelog.mjs json > out/changelog.json
          ls -l out
      - name: Release
        run: |
          # what changed since the previous release
          previous=$(gh release view --json tagName --jq .tagName 2>/dev/null | sed 's/^v//' || true)
          { node src/scripts/changelog.mjs notes "${previous:-0.0.0}" "$VERSION"; echo; echo "Compilée depuis ${GITHUB_SHA::7}."; } > notes.md
          gh release create "v$VERSION" out/* --target "$GITHUB_SHA" --latest \
            --title "Entre Nous $VERSION" --notes-file notes.md
          # newest first: from the 11th on, deleted
          gh release list --limit 100 --json tagName,createdAt --jq 'sort_by(.createdAt) | reverse | .[10:] | .[].tagName' \
            | while read -r tag; do gh release delete "$tag" --cleanup-tag --yes; done
